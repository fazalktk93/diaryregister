{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card auth-card">
      <div class="card-body text-center py-5">
        <div class="auth-icon"><i class="bi bi-check2-circle"></i></div>
        <h4 class="mb-3">Password reset successful</h4>
        <p class="text-muted mb-4">Your password has been updated. You can now sign in with your new credentials.</p>
        <a href="{% url 'login' %}" class="btn btn-primary fw-bold"><i class="bi bi-box-arrow-in-right"></i> Go to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
