{% extends "base.html" %}
{% block title %}Change Password - Diary Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card auth-card">
      <div class="card-header"><h5 class="mb-0"><i class="bi bi-shield-lock"></i> Change password</h5></div>
      <div class="card-body">
        <p class="text-muted mb-4">Use a unique password to keep your diary register secure.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_old_password" class="form-label">Old password</label>
            <input id="id_old_password" type="password" name="old_password" class="form-control" autocomplete="current-password" required>
          </div>
          <div class="mb-3">
            <label for="id_new_password1" class="form-label">New password</label>
            <input id="id_new_password1" type="password" name="new_password1" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="mb-4">
            <label for="id_new_password2" class="form-label">Confirm new password</label>
            <input id="id_new_password2" type="password" name="new_password2" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="d-grid"><button class="btn btn-primary"><i class="bi bi-check2-circle"></i> Update password</button></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
