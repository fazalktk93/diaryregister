{% extends 'base.html' %}{% block content %}
<h1 class="visually-hidden">Diary reports</h1>
<form class="card p-4 mb-3" method="get"><div class="form-section-title">REPORTING PERIOD</div><div class="row g-3"><div class="col-md-3"><label for="report-year" class="form-label">Year</label><input id="report-year" name="year" class="form-control" type="number" min="1" max="9999" value="{{ request.GET.year|default:report_year|default:'' }}" placeholder="All years"></div><div class="col-md-3"><label for="report-month" class="form-label">Month (optional)</label><select id="report-month" name="month" class="form-select"><option value="">Full year / all months</option>{% for month in report_months %}<option value="{{ month.month }}" {% if request.GET.month == month.month|stringformat:'s' %}selected{% endif %}>{{ month.name }}</option>{% endfor %}</select></div><div class="col-md-3"><label for="report-from" class="form-label">Diary date from</label><input id="report-from" name="date_from" type="date" class="form-control" value="{{ request.GET.date_from }}"></div><div class="col-md-3"><label for="report-to" class="form-label">Diary date through</label><input id="report-to" name="date_to" type="date" class="form-control" value="{{ request.GET.date_to }}"></div></div><div class="form-section-title mt-4">REFINE REPORT (OPTIONAL)</div><div class="row g-3"><div class="col-md-4"><label for="report-q" class="form-label">Diary number or search text</label><input id="report-q" name="q" class="form-control" value="{{ request.GET.q }}"></div><div class="col-md-4"><label for="report-sender" class="form-label">Received from</label><input id="report-sender" name="received_from" class="form-control" value="{{ request.GET.received_from }}"></div><div class="col-md-4"><label for="report-destination" class="form-label">Destination office</label><input id="report-destination" name="marked_to" class="form-control" value="{{ request.GET.marked_to }}"></div><div class="col-md-3"><label for="report-ref" class="form-label">Received diary number</label><input id="report-ref" name="received_diary_no" class="form-control" value="{{ request.GET.received_diary_no }}"></div><div class="col-md-3"><label for="report-type" class="form-label">File / Letter</label><input id="report-type" name="file_letter" class="form-control" value="{{ request.GET.file_letter }}"></div><div class="col-md-3"><label for="report-folders" class="form-label">Number of folders</label><input id="report-folders" name="no_of_folders" class="form-control" type="number" min="0" value="{{ request.GET.no_of_folders }}"></div><div class="col-md-3"><label for="report-subject" class="form-label">Subject</label><input id="report-subject" name="subject" class="form-control" value="{{ request.GET.subject }}"></div><div class="col-12"><label for="report-remarks" class="form-label">Remarks</label><input id="report-remarks" name="remarks" class="form-control" value="{{ request.GET.remarks }}"></div></div><div class="mt-3 d-flex gap-2"><button class="btn btn-info">{% include 'v2/_icon.html' with name='chart' %} Generate report</button><a class="btn btn-cancel" href="{% url 'reports_table' %}">Clear filters</a></div></form>
{% include 'v2/_register_results.html' with report_mode=True %}
{% endblock %}
