{% extends 'base.html' %}{% block content %}
<h1 class="visually-hidden">Diary register</h1><div class="page-actions">{% if can_write %}<a class="btn btn-success" href="{% url 'diary_create' %}" data-modal-url="{% url 'diary_create' %}" data-modal-title="Register diary">{% include 'v2/_icon.html' with name='plus' %} Add diary</a>{% endif %}</div>
<form id="diaryFilters" class="card p-3 mb-3" method="get"><div class="row g-3"><div class="col-md-6"><label for="q" class="form-label">Search correspondence</label><input id="q" name="q" class="form-control" value="{{ request.GET.q }}" placeholder="Diary number, subject, sender, reference" autocomplete="off" aria-describedby="search-status"></div><div class="col-md-3"><label for="year" class="form-label">Year</label><input id="year" name="year" type="number" min="1" max="9999" class="form-control" value="{{ request.GET.year }}" placeholder="All years"></div><div class="col-md-3"><label for="month" class="form-label">Month</label><select id="month" name="month" class="form-select"><option value="">All months</option>{% for month in report_months %}<option value="{{ month.month }}" {% if request.GET.month == month.month|stringformat:'s' %}selected{% endif %}>{{ month.name }}</option>{% endfor %}</select></div></div><input type="hidden" name="date_from" value="{{ request.GET.date_from }}"><input type="hidden" name="date_to" value="{{ request.GET.date_to }}"><div class="d-flex align-items-center flex-wrap gap-2 mt-3"><button class="btn btn-info">{% include 'v2/_icon.html' with name='search' %} Search / filter</button><a class="btn btn-cancel" href="{% url 'diary_list' %}">Clear filters</a><span id="search-status" class="visually-hidden" aria-live="polite"></span></div></form>
{% include 'v2/_register_results.html' %}
{% endblock %}
