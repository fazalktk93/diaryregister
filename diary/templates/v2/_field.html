<div class="field {% if field.errors %}has-errors{% endif %} {% if width %}{{ width }}{% else %}col-md-6{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<div class="form-check mt-4">{{ field }}<label for="{{ field.id_for_label }}" class="form-check-label">{{ field.label }}</label></div>
  {% else %}<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="field-required" aria-label="required"> *</span>{% endif %}</label>{% if field.name == 'received_from' or field.name == 'marked_to' or field.name == 'to_office' %}<div class="office-input">{{ field }}<button type="button" class="office-toggle" aria-label="Show saved offices for {{ field.label }}" aria-expanded="false">&#9662;</button><div class="office-options" hidden></div></div>{% else %}{{ field }}{% endif %}{% endif %}
  {% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}
</div>
