<nav class="d-flex justify-content-between mt-3" aria-label="Pagination"><span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?{{ filter_query }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %} {% if page_obj.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?{{ filter_query }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}</div></nav>
